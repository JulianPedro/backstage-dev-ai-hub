version: 2

# Dependabot owns GitHub Actions version updates for this template.
# It is SHA-pin aware: for an action pinned as `owner/repo@<sha> # vX.Y.Z`,
# it bumps both the SHA and the trailing version comment, keeping the
# AGENTS.md "pin third-party actions to a full-length SHA" rule intact.
#
# Backstage / npm dependencies are intentionally NOT managed here — the
# provisioning workflow bumps them once via `backstage-cli versions:bump`,
# and thereafter `yarn backstage-cli versions:bump` is the maintained path.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore(actions)
    labels:
      - dependencies
