# Example Backstage app-config.yaml additions for Dev AI Hub plugin
# Add these sections to your Backstage instance's app-config.yaml

# 1. Register the backend plugin in packages/backend/src/index.ts:
#    backend.add(import('@nospt/plugin-dev-ai-hub-backend'));
#
# 2. Register the frontend plugin (New Frontend System) in packages/app/src/App.tsx:
#    import devAiHub from '@nospt/plugin-dev-ai-hub';
#    app.addExtensions([devAiHub]);

devAiHub:
  telemetry:
    # Stable salt for hashing telemetry caller identity (ADR-0007).
    # Must not change across restarts/deploys. Set via env var, never literal.
    salt: ${DEV_AI_HUB_TELEMETRY_SALT}

# GitHub integration (required for reading GitHub repositories)
integrations:
  github:
    - host: github.com
      apps:
        - appId: ${GITHUB_APP_ID}
          clientId: ${GITHUB_CLIENT_ID}
          clientSecret: ${GITHUB_CLIENT_SECRET}
          privateKey: ${GITHUB_PRIVATE_KEY}
          allowedInstallationOwners:
            - nosportugal
