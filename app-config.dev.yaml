app:
  title: Dev AI Hub
  baseUrl: http://localhost:3000

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection: ":memory:"

devAiHub:
  telemetry:
    # Dev-only value — never reuse in a real deployment (ADR-0007).
    salt: dev-only-telemetry-salt
  providers:
    - id: backstage-test-01
      type: github
      target: https://github.com/nosportugal/backstage-test-01.git
      branch: main
      schedule:
        frequency:
          minutes: 60
        timeout:
          minutes: 5
    - id: flai-ai-dev-coe-toolkit
      type: github
      target: https://github.com/nosportugal/flai-ai-dev-coe-toolkit.git
      branch: main
      schedule:
        frequency:
          minutes: 60
        timeout:
          minutes: 5


# Guest sign-in for local dev — the v2 routes require Backstage auth (ADR-0005)
auth:
  providers:
    guest: {}

catalog:
  rules:
    - allow: [Component, API, Resource, System, Domain, Location, AiResource]
  locations:
    # Local example AiResource entities — seeded for dev + test (ADR-0004: hand-authored only)
    - type: file
      target: ../../examples/catalog/all.yaml
      rules:
        - allow: [AiResource, Location]

# GitHub integration — required for the sync to fetch files
integrations:
  github:
    - host: github.com
      apps:
        - appId: ${GITHUB_APP_ID}
          clientId: ${GITHUB_CLIENT_ID}
          clientSecret: ${GITHUB_CLIENT_SECRET}
          privateKey: ${GITHUB_PRIVATE_KEY}
          allowedInstallationOwners:
            - nosportugal
