apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: post-edit-lint
  title: Post-Edit Lint Hook
  description: A PostToolUse hook that automatically runs a linter after any file edit, catching style and syntax errors before they reach review.
  tags: [linting, quality, automation]
  annotations:
    # TODO(#4): replace with a reachable URL once body resolution is wired
    backstage.io/source-location: url:https://github.com/nosportugal/backstage-plugin-dev-ai-hub/blob/main/examples/catalog/hook-post-edit-lint.yaml
    devaihub/compatible-frameworks: "claude-code"
    devaihub/hook-event: "PostToolUse"
    devaihub/hook-matcher: ".*Edit.*"
spec:
  type: hook
  lifecycle: production
  owner: group:ai-platform-team
