apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: post-edit-lint
  title: Post-Edit Lint Hook
  description: A PostToolUse hook that automatically runs a linter after any file edit, catching style and syntax errors before they reach review.
  tags: [linting, quality, automation]
  annotations:
    backstage.io/source-location: url:https://github.com/nosportugal/backstage-plugin-dev-ai-hub/blob/main-nos/examples/hooks/post-edit-lint.md
    devaihub.io/compatible-frameworks: claude-code
    devaihub.io/hook-event: PostToolUse
    devaihub.io/hook-matcher: .*Edit.*
spec:
  type: hook
  lifecycle: production
  owner: group:ai-platform-team
