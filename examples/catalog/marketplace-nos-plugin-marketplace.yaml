apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: nos-plugin-marketplace
  title: NOS Plugin Marketplace
  description: Curated marketplace of approved NOS plugins for AI coding tools. Add it once to your tool, then install its plugins from it.
  tags: [marketplace, curated]
  annotations:
    backstage.io/source-location: url:https://github.com/nosportugal/backstage-plugin-dev-ai-hub/blob/main-nos/examples/marketplaces/nos-plugin-marketplace.json
spec:
  type: marketplace
  lifecycle: production
  owner: group:ai-platform-team
  version: 1.0.0
  # Compatible frameworks (native field — honoured for any spec.type, not just
  # `skill`; takes priority over devaihub.io/compatible-frameworks when present).
  agents:
    - claude-code
    - github-copilot
  # Contained plugins. Upstream requires this field on `spec.type: marketplace`
  # (Backstage 1.54.0) and generates hasPart/partOf relations from it.
  plugins:
    - airesource:default/secure-dev-bundle
