  title: API Architect Agent
  description: Mentors engineers through API design and generates working client connectivity code from the API aspects they provide.
  tags: [api, architect, codegen]
  annotations:
    backstage.io/source-location: url:https://github.com/nosportugal/backstage-plugin-dev-ai-hub/blob/main-nos/examples/agents/api-architect.md
