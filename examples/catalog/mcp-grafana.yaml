apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: grafana-mcp
  title: Grafana MCP Config
  description: An MCP server configuration exposing Grafana dashboards, alerts, and metrics queries as tools for AI agents. Supports HTTP transport.
  tags: [observability, grafana, metrics, mcp]
  annotations:
    backstage.io/source-location: url:https://github.com/nosportugal/backstage-plugin-dev-ai-hub/blob/main-nos/examples/mcp/grafana-mcp.json
spec:
  type: mcp-config
  lifecycle: production
  owner: group:observability
  # Compatible frameworks (native field — honoured for any spec.type, not just
  # `skill`; takes priority over devaihub.io/compatible-frameworks when present).
  agents:
    - claude-code
    - github-copilot
    - cursor
    - google-gemini
