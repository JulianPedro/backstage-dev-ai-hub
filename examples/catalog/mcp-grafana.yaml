apiVersion: backstage.io/v1alpha1
kind: AiResource
metadata:
  name: grafana-mcp
  title: Grafana MCP Server
  description: An MCP server that exposes Grafana dashboards, alerts, and metrics queries as tools for AI agents. Supports HTTP transport.
  tags: [observability, grafana, metrics, mcp]
  annotations:
    # TODO(#4): replace with a reachable URL once body resolution is wired
    backstage.io/source-location: url:https://github.com/nosportugal/backstage-plugin-dev-ai-hub/blob/main/examples/catalog/mcp-grafana.yaml
    devaihub/compatible-frameworks: "claude-code,cursor"
    devaihub/mcp-type: "http"
    devaihub/mcp-uri: "http://localhost:8080/mcp"
spec:
  type: mcp
  lifecycle: production
  owner: group:observability
